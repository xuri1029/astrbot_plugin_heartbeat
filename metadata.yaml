name: astrbot_plugin_heartbeat
display_name: 心念一动
short_desc: 每隔 30~80 分钟自己醒来思考，决定要不要主动做点什么
desc: |
  她不再只是等你开口。

  每隔 30~80 分钟（随机）自己醒一次：看一眼现在几点、你多久没说话、
  有没有答应过还没做完的事，然后用当前模型思考一轮，自己决定要不要行动。

  可选动作：主动发消息 / 发 QQ 空间说说 / 记私人笔记 / 什么都不做。

  特性：
  - 不碰聊天主链，只做旁路思考，不影响正常对话
  - 可调用所有已注册工具（插件、记忆、空间、生图等），最多 8 轮 / 120 秒
  - 会主动让路：你 10 分钟内刚说过话、或 3 小时内已有主动消息，就只思考不动手
  - 安静时段（默认 01:00-09:00）不醒
  - 删除类工具默认黑名单，绝不碰数据
  - 每次醒来都有日志，可随时用 /心跳 日志 查她想过什么
  - 单次约 8k~20k token，成本低
version: 0.1.0
author: 东哥
repo: https://github.com/xuri1029/astrbot_plugin_heartbeat
